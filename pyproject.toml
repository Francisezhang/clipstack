[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipstack"
version = "1.0.0"
description = "Clipboard history manager for macOS — search, pin, and recall 1000 entries"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyperclip>=1.8.0",
]
readme = "docs/README.md"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
clipstack = "clipstack.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipstack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"